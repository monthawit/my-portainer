services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1   # เช็กเวอร์ชันล่าสุดที่ GitHub releases ของ cAdvisor
    container_name: cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true          # เอาเฉพาะ container ไม่เอา cgroup อื่นๆ ของระบบ
      - --housekeeping_interval=15s

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    pid: host
    network_mode: host               # ใช้พอร์ต 9100 ของเครื่องตรงๆ
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
